<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QRify — QR Code Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-18px) rotate(6deg);
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.35;
            }
            50% {
                opacity: 0.7;
            }
        }

        @keyframes timerGlow {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        .float {
            animation: float 6s ease-in-out infinite;
        }

        .float-slow {
            animation: float 9s ease-in-out infinite;
        }

        .pulse-glow {
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .timer-glow {
            animation: timerGlow 2s ease-in-out infinite;
        }
    </style>
</head>

<body class="min-h-screen overflow-x-hidden bg-[#050816] text-white">

    <!-- Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden">

        <div class="absolute -left-32 -top-32
                    h-72 w-72 rounded-full
                    bg-cyan-500/20 blur-[100px]
                    pulse-glow">
        </div>

        <div class="absolute -right-32 top-1/4
                    h-80 w-80 rounded-full
                    bg-violet-600/20 blur-[120px]
                    pulse-glow">
        </div>

        <div class="absolute bottom-[-120px] left-1/3
                    h-72 w-72 rounded-full
                    bg-fuchsia-500/10 blur-[110px]">
        </div>

        <div class="absolute inset-0
                    bg-[linear-gradient(rgba(255,255,255,0.025)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.025)_1px,transparent_1px)]
                    bg-[size:45px_45px]">
        </div>

        <div class="float absolute left-[8%] top-[18%]
                    text-3xl text-cyan-300/20">
            ⬡
        </div>

        <div class="float-slow absolute right-[12%] top-[15%]
                    text-4xl text-violet-300/20">
            ◈
        </div>

        <div class="float absolute bottom-[20%] left-[13%]
                    text-2xl text-fuchsia-300/20">
            #
        </div>

        <div class="float-slow absolute bottom-[15%] right-[10%]
                    text-3xl text-cyan-300/20">
            ◇
        </div>

        <div class="float absolute left-[25%] top-[8%]
                    text-xl text-white/10">
            +
        </div>

        <div class="float-slow absolute right-[30%] bottom-[10%]
                    text-xl text-white/10">
            ×
        </div>

    </div>


    <!-- Main -->
    <main class="flex min-h-screen items-center justify-center px-4 py-6">

        <!-- Card -->
        <section class="relative w-full max-w-md
                        overflow-hidden
                        rounded-[1.75rem]
                        border border-white/[0.08]
                        bg-white/[0.045]
                        p-5
                        shadow-2xl
                        backdrop-blur-2xl
                        sm:p-6">

            <!-- Top Glow -->
            <div class="absolute -top-32 left-1/2
                        h-56 w-56
                        -translate-x-1/2
                        rounded-full
                        bg-cyan-400/10
                        blur-[80px]">
            </div>


            <!-- Header -->
            <div class="relative mb-5 text-center">

                <div class="mx-auto mb-3 flex h-12 w-12
                            items-center justify-center
                            rounded-2xl
                            border border-cyan-300/20
                            bg-gradient-to-br
                            from-cyan-400/15
                            via-violet-500/15
                            to-fuchsia-500/15
                            shadow-[0_0_30px_rgba(34,211,238,0.12)]">

                    <span class="text-xl">⌁</span>

                </div>

                <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">
                    QR<span class="bg-gradient-to-r
                                   from-cyan-300
                                   via-violet-400
                                   to-fuchsia-400
                                   bg-clip-text
                                   text-transparent">
                        ify
                    </span>
                </h1>

                <p class="mt-1.5 text-xs text-white/45">
                    Turn your text or URL into a QR code instantly.
                </p>

            </div>


            <!-- Input -->
            <div class="relative mb-4">

                <label for="qrInput"
                       class="mb-2 block text-[10px]
                              font-medium uppercase
                              tracking-[0.18em]
                              text-white/45">
                    Enter text or URL
                </label>

                <div class="group relative">

                    <input
                        id="qrInput"
                        type="text"
                        placeholder="https://example.com"
                        autocomplete="off"
                        class="w-full rounded-2xl
                               border border-white/[0.09]
                               bg-black/20
                               px-4 py-3.5
                               text-sm text-white
                               outline-none
                               placeholder:text-white/20
                               transition duration-300
                               focus:border-cyan-300/40
                               focus:bg-black/30
                               focus:ring-4
                               focus:ring-cyan-400/[0.06]"
                    />

                    <div class="pointer-events-none
                                absolute inset-y-0 right-4
                                flex items-center
                                text-white/20">
                        ↗
                    </div>

                </div>

            </div>


            <!-- Generate Button -->
            <button
                id="generateBtn"
                class="group relative w-full overflow-hidden
                       rounded-2xl
                       bg-gradient-to-r
                       from-cyan-400
                       via-violet-500
                       to-fuchsia-500
                       px-5 py-3.5
                       font-semibold
                       text-white
                       shadow-[0_0_30px_rgba(139,92,246,0.22)]
                       transition duration-300
                       hover:scale-[1.015]
                       hover:shadow-[0_0_45px_rgba(139,92,246,0.35)]
                       active:scale-[0.98]">

                <span class="relative z-10 flex items-center
                             justify-center gap-2 text-sm">

                    Generate QR

                    <span class="transition duration-300
                                 group-hover:translate-x-1">
                        →
                    </span>

                </span>

                <div class="absolute inset-0
                            translate-x-[-100%]
                            bg-white/15
                            transition duration-700
                            group-hover:translate-x-[100%]">
                </div>

            </button>


            <!-- Generated QR -->
            <div class="mt-5">

                <div class="mb-2 flex items-center justify-between">

                    <span class="text-[10px]
                                 font-medium uppercase
                                 tracking-[0.18em]
                                 text-white/35">
                        Generated QR
                    </span>

                    <span class="flex items-center gap-1.5
                                 text-[10px]
                                 text-emerald-300/70">

                        <span class="h-1.5 w-1.5
                                     rounded-full
                                     bg-emerald-400
                                     shadow-[0_0_7px_rgba(52,211,153,0.7)]">
                        </span>

                        Ready

                    </span>

                </div>


                <!-- QR Box -->
                <div id="qrBox"
                     class="flex min-h-[190px]
                            items-center justify-center
                            rounded-2xl
                            border border-dashed
                            border-white/[0.09]
                            bg-black/20
                            p-5
                            shadow-inner">

                    <div class="text-center">

                        <div class="mx-auto mb-3 flex h-12 w-12
                                    items-center justify-center
                                    rounded-xl
                                    border border-white/[0.07]
                                    bg-white/[0.025]">

                            <span class="text-xl opacity-30">
                                ▦
                            </span>

                        </div>

                        <p class="text-xs text-white/30">
                            Your QR code will appear here
                        </p>

                    </div>

                </div>


                <!-- QR Actions -->
                <div class="mt-3 grid grid-cols-2 gap-2">

                    <button
                        id="regenerateBtn"
                        class="rounded-xl
                               border border-cyan-400/15
                               bg-cyan-400/[0.06]
                               px-4 py-2.5
                               text-xs font-medium
                               text-cyan-200/80
                               transition duration-300
                               hover:border-cyan-300/30
                               hover:bg-cyan-400/[0.10]
                               active:scale-[0.97]">

                        ↻ Regenerate QR

                    </button>


                    <button
                        id="clearBtn"
                        class="rounded-xl
                               border border-white/[0.08]
                               bg-white/[0.025]
                               px-4 py-2.5
                               text-xs font-medium
                               text-white/45
                               transition duration-300
                               hover:border-red-400/20
                               hover:bg-red-400/[0.06]
                               hover:text-red-300/80
                               active:scale-[0.97]">

                        × Clear

                    </button>

                </div>


                <!-- 30 Second Timer -->
                <div class="mt-3
                            rounded-xl
                            border border-white/[0.06]
                            bg-black/20
                            px-4 py-3">

                    <div class="mb-2 flex items-center justify-between">

                        <div class="flex items-center gap-2">

                            <span class="h-1.5 w-1.5
                                         rounded-full
                                         bg-cyan-400
                                         timer-glow
                                         shadow-[0_0_8px_rgba(34,211,238,0.8)]">
                            </span>

                            <span class="text-[9px]
                                         font-medium
                                         uppercase
                                         tracking-[0.16em]
                                         text-white/35">
                                QR expires in
                            </span>

                        </div>


                        <span id="timer"
                              class="font-mono text-xs
                                     font-bold
                                     text-cyan-300
                                     drop-shadow-[0_0_7px_rgba(34,211,238,0.5)]">
                            30s
                        </span>

                    </div>


                    <!-- Timer Progress -->
                    <div class="h-1 overflow-hidden
                                rounded-full
                                bg-white/[0.06]">

                        <div id="timerBar"
                             class="h-full w-full
                                    rounded-full
                                    bg-gradient-to-r
                                    from-cyan-400
                                    via-violet-500
                                    to-fuchsia-500
                                    transition-all
                                    duration-1000">
                        </div>

                    </div>

                </div>

            </div>


            <!-- Footer -->
            <div class="mt-4 flex items-center
                        justify-center gap-2
                        text-[10px] text-white/25">

                <span>Fast</span>
                <span>•</span>
                <span>Simple</span>
                <span>•</span>
                <span>Temporary</span>

            </div>

        </section>

    </main>


    <!-- QR Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <!-- Your JS -->
    <script src="index.js"></script>

</body>
</html>
